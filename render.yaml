# Umami Medusa on Render — API + Admin (+ Postgres + Redis)
# Docs: docs/RENDER_MEDUSA.md
#
# Deploy: Render Dashboard → New → Blueprint → connect umami-restaurant repo
# Or: https://dashboard.render.com/blueprints

services:
  - type: web
    name: umami-medusa
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    dockerBuildArgs:
      # Override after first live URL is known, then clear build cache + redeploy
      - key: MEDUSA_BACKEND_URL
        value: https://umami-medusa.onrender.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEDUSA_WORKER_MODE
        value: shared
      - key: DISABLE_MEDUSA_ADMIN
        value: "false"
      - key: MEDUSA_BACKEND_URL
        value: https://umami-medusa.onrender.com
      - key: STORE_CORS
        value: http://localhost:8000
      - key: ADMIN_CORS
        value: https://umami-medusa.onrender.com
      - key: AUTH_CORS
        value: https://umami-medusa.onrender.com,http://localhost:8000,http://localhost:9000
      - key: DATABASE_URL
        fromDatabase:
          name: umami-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: umami-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: AUTH_MFA_ENCRYPTION_KEY
        generateValue: true
      - key: RESTAURANT_GUEST_STATUS_SECRET
        generateValue: true
      - key: REVALIDATE_SECRET
        generateValue: true
      - key: STOREFRONT_REVALIDATE_URL
        sync: false
      - key: MEDUSA_FF_TRANSLATION
        value: "true"

  - type: keyvalue
    name: umami-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: umami-postgres
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: umami
    user: umami
